var RE={pres:{ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]},pret:{ar:["é","aste","ó","amos","asteis","aron"],er:["í","iste","ió","imos","isteis","ieron"],ir:["í","iste","ió","imos","isteis","ieron"]},impf:{ar:["aba","abas","aba","ábamos","abais","aban"],er:["ía","ías","ía","íamos","íais","ían"],ir:["ía","ías","ía","íamos","íais","ían"]},presSub:{ar:["e","es","e","emos","éis","en"],er:["a","as","a","amos","áis","an"],ir:["a","as","a","amos","áis","an"]}};
var FE=["é","ás","á","emos","éis","án"],CE=["ía","ías","ía","íamos","íais","ían"];

function gS(v){return v.slice(0,-2);}
function gT(v){var d=VD[v];return d?d.t:v.endsWith("ar")?"ar":v.endsWith("er")?"er":"ir";}
function gP(v){var d=VD[v];if(d&&d.part)return d.part;var t=gT(v),s=gS(v);return t==="ar"?s+"ado":s+"ido";}

function conj(v,tid,pi){
  var d=VD[v]||{t:gT(v),tr:"?"},tp=d.t,st=gS(v);
  if(tid==="preterito_perfecto")return HABER.pres[pi]+" "+gP(v);
  if(tid==="preterito_pluscuamperfecto")return HABER.impf[pi]+" "+gP(v);
  if(tid==="futuro_compuesto")return HABER.fut[pi]+" "+gP(v);
  if(tid==="condicional_compuesto")return HABER.cond[pi]+" "+gP(v);
  if(tid==="perfecto_sub")return HABER.presSub[pi]+" "+gP(v);
  if(tid==="pluscuamperfecto_sub")return HABER.impfSub[pi]+" "+gP(v);
  if(tid==="presente_ind"){if(d.pres)return d.pres.split(",")[pi];return st+RE.pres[tp][pi];}
  if(tid==="preterito_indefinido"){if(d.pret)return d.pret.split(",")[pi];return st+RE.pret[tp][pi];}
  if(tid==="preterito_imperfecto"){if(d.impf)return d.impf.split(",")[pi];return st+RE.impf[tp][pi];}
  if(tid==="futuro_simple"){return(d.futS||v)+FE[pi];}
  if(tid==="condicional_simple"){return(d.futS||v)+CE[pi];}
  if(tid==="presente_sub"){if(d.presSub)return d.presSub.split(",")[pi];return st+RE.presSub[tp][pi];}
  if(tid==="imperfecto_sub"){
    var p3=d.pret?d.pret.split(",")[5]:st+RE.pret[tp][5];
    var iS=p3.slice(0,-3);var ends=["ra","ras","ra","ramos","rais","ran"];
    if(pi===3)return accentLast(iS)+"ramos";return iS+ends[pi];
  }
  if(tid==="futuro_sub"){
    var p3f=d.pret?d.pret.split(",")[5]:st+RE.pret[tp][5];
    var fS=p3f.slice(0,-3);var fe=["re","res","re","remos","reis","ren"];
    if(pi===3)return accentLast(fS)+"remos";return fS+fe[pi];
  }
  if(tid==="imperativo_af"){
    var sf=d.presSub?d.presSub.split(","):null;
    if(!sf){sf=[];for(var s=0;s<6;s++)sf.push(st+RE.presSub[tp][s]);}
    if(pi===0){if(d.impTu)return d.impTu;var pf=d.pres?d.pres.split(","):null;return pf?pf[2]:st+RE.pres[tp][2];}
    if(pi===1)return sf[2];if(pi===2)return sf[3];
    if(pi===3){if(d.impVos)return d.impVos;return v.slice(0,-1)+"d";}
    if(pi===4)return sf[5];
  }
  if(tid==="imperativo_neg"){
    var sn=d.presSub?d.presSub.split(","):null;
    if(!sn){sn=[];for(var sn2=0;sn2<6;sn2++)sn.push(st+RE.presSub[tp][sn2]);}
    return"no "+sn[[1,2,3,4,5][pi]];
  }
  return"?";
}

{id:"condicional_simple",name:"Condicional Simple",mood:"Indicativo",ex:"Yo comería más|Ja bym jadł więcej"},
{id:"futuro_compuesto",name:"Futuro Compuesto",mood:"Indicativo",ex:"Habrá llegado ya|Pewnie już dotarł"},
{id:"condicional_compuesto",name:"Condicional Compuesto",mood:"Indicativo",ex:"Habría ido contigo|Byłbym poszedł z tobą"},
{id:"presente_sub",name:"Presente",mood:"Subjuntivo",ex:"Quiero que vengas|Chcę żebyś przyszedł"},
{id:"imperfecto_sub",name:"Imperfecto",mood:"Subjuntivo",ex:"Si tuviera dinero...|Gdybym miał pieniądze..."},
{id:"perfecto_sub",name:"Perfecto",mood:"Subjuntivo",ex:"Espero que hayas comido|Mam nadzieję, że zjadłeś"},
{id:"pluscuamperfecto_sub",name:"Pluscuamperfecto",mood:"Subjuntivo",ex:"Si hubiera sabido...|Gdybym był wiedział..."},
{id:"futuro_sub",name:"Futuro",mood:"Subjuntivo",ex:"Donde fuere...|Gdziekolwiek pójdzie... (archaiczny)"},
{id:"imperativo_af",name:"Imperativo Afirmativo",mood:"Imperativo",ex:"¡Habla! ¡Come!|Mów! Jedz!"},
{id:"imperativo_neg",name:"Imperativo Negativo",mood:"Imperativo",ex:"¡No hables!|Nie mów!"},
];
var PERSONS=[{l:"yo"},{l:"tú"},{l:"él/ella/usted"},{l:"nosotros"},{l:"vosotros"},{l:"ellos/ustedes"}];
var IMP_P=[{l:"tú"},{l:"usted"},{l:"nosotros"},{l:"vosotros"},{l:"ustedes"}];
var VERBS=Object.keys(VD);
var MCOL={Indicativo:{bg:"#1a3a4a",ac:"#4fc3f7",lt:"#e1f5fe"},Subjuntivo:{bg:"#3a1a4a",ac:"#ce93d8",lt:"#f3e5f5"},Imperativo:{bg:"#4a3a1a",ac:"#ffb74d",lt:"#fff3e0"}};

// ============ STATE ============
var state={
  actT:TENSES.map(function(t){return t.id;}),
  cur:null,input:"",status:"idle",correctAns:"",
  score:{c:0,w:0},errs:[],streak:0,
  view:"drill" // drill|settings|errors
};

function load(){
  try{
    var s=localStorage.getItem("conj_state");
    if(s){var p=JSON.parse(s);state.errs=p.errs||[];state.score=p.score||{c:0,w:0};state.actT=p.actT||state.actT;}
  }catch(e){}
}
function save(){
  try{localStorage.setItem("conj_state",JSON.stringify({errs:state.errs,score:state.score,actT:state.actT}));}catch(e){}
}

function pick(a){return a[Math.floor(Math.random()*a.length)];}

function gen(){
  if(!state.actT.length)return;
  var t=pick(TENSES.filter(function(x){return state.actT.indexOf(x.id)>=0;}));
  var isImp=t.mood==="Imperativo";
  var p=pick(isImp?IMP_P:PERSONS);
  state.cur={v:pick(VERBS),p:p,t:t,isImp:isImp};
  state.input="";state.status="idle";state.correctAns="";
  render();
  setTimeout(function(){var el=document.getElementById("ans");if(el)el.focus();},100);
}

function checkAns(){
  if(!state.input.trim()||state.status!=="idle")return;
  var c=state.cur;
  var pi=c.isImp?IMP_P.indexOf(c.p):PERSONS.indexOf(c.p);
  var correct=conj(c.v,c.t.id,pi);
  var norm=state.input.trim().toLowerCase();
  var normC=correct.toLowerCase();
  var ok=norm===normC;
  if(!ok&&c.t.id==="imperfecto_sub"){
    var se=correct.replace(/ra$/,"se").replace(/ras$/,"ses").replace(/ramos$/,"semos").replace(/rais$/,"seis").replace(/ran$/,"sen");
    if(norm===se.toLowerCase())ok=true;
  }
  if(ok){
    state.status="correct";state.score.c++;state.streak++;save();render();
    setTimeout(gen,900);
  }else{
    state.status="wrong";state.correctAns=correct;state.score.w++;state.streak=0;
    state.errs.unshift({v:c.v,pe:c.p.l,te:c.t.name+" ("+c.t.mood+")",y:state.input.trim(),c:correct,ts:Date.now()});
    if(state.errs.length>100)state.errs=state.errs.slice(0,100);
    save();render();
  }
}

// ============ RENDER ============
function render(){
  var app=document.getElementById("app");
  var total=state.score.c+state.score.w;
  var pct=total>0?Math.round(state.score.c/total*100):0;
  var mc=state.cur?MCOL[state.cur.t.mood]:MCOL.Indicativo;
  var h='';

  // Header
  h+='<div class="hdr"><div><h1>Conjugación</h1><div class="sub">'+(total>0?pct+'% · '+state.score.c+'✓ '+state.score.w+'✗':'¡Vamos!')+'</div></div>';
  h+='<div class="hdr-btns">';
  if(state.streak>=3)h+='<span class="streak">🔥 '+state.streak+'</span>';
  h+='<button onclick="showErr()">Błędy ('+state.errs.length+')</button>';
  h+='<button onclick="showSet()">⚙</button>';
  h+='</div></div>';

  // Stats bar
  if(total>0){
    h+='<div class="stats-bar">Sesja: <span>'+total+'</span> pytań · Seria: <span>'+state.streak+'</span> · Najczęstszy błąd: <span>'+(getMostMissed()||'—')+'</span></div>';
  }

  if(state.view==="settings"){
    h+=renderSettings();
  }else if(state.view==="errors"){
    h+=renderErrors();
  }else if(state.cur){
    h+=renderDrill(mc);
  }

  app.innerHTML=h;
}

function getMostMissed(){
  if(!state.errs.length)return null;
  var counts={};
  state.errs.forEach(function(e){var k=e.v;counts[k]=(counts[k]||0)+1;});
  var max=0,word="";
  for(var k in counts)if(counts[k]>max){max=counts[k];word=k;}
  return max>1?word+" ("+max+"x)":null;
}

function renderSettings(){
  var h='<div class="panel"><div class="panel-title">Wybierz czasy do ćwiczeń:</div>';
  ["Indicativo","Subjuntivo","Imperativo"].forEach(function(mood){
    var mTs=TENSES.filter(function(t){return t.mood===mood;});
    var col=MCOL[mood];
    var allOn=mTs.every(function(t){return state.actT.indexOf(t.id)>=0;});
    h+='<div class="mood-group">';
    h+='<button class="mood-btn" onclick="togMood(\''+mood+'\')" style="background:'+(allOn?col.ac+'22':'transparent')+';border:1px solid '+col.ac+'55;color:'+col.ac+'">'+mood+(allOn?' ✓':'')+'</button>';
    h+='<div class="tense-list">';
    mTs.forEach(function(t){
      var on=state.actT.indexOf(t.id)>=0;
      h+='<div class="tense-item"><button class="tense-btn" onclick="togT(\''+t.id+'\')" style="background:'+(on?col.ac+'33':'#21262d')+';border:1px solid '+(on?col.ac:'#30363d')+';color:'+(on?col.lt:'#484f58')+'">'+t.name+'</button>';
      h+='<div class="tense-ex">'+t.ex.split("|")[0]+'</div></div>';
    });
    h+='</div></div>';
  });
  h+='<button class="start-btn" onclick="startDrill()">Empezar ▸</button></div>';
  return h;
}

function renderErrors(){
  var h='<div class="panel err-panel">';
  if(state.errs.length>0){
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="panel-title" style="margin:0;color:#f85149">Twoje błędy (zapisane):</div>';
    h+='<button class="clear-btn" onclick="clearErrs()">Wyczyść</button></div>';
    state.errs.forEach(function(e,i){
      h+='<div class="err-item"><div class="err-meta">'+e.v+' · '+e.pe+' · '+e.te+'</div>';
      h+='<div><span class="err-wrong">'+e.y+'</span> → <span class="err-right">'+e.c+'</span></div></div>';
    });
  }else{
    h+='<div style="text-align:center;color:#8b949e;padding:20px">Brak błędów — tak trzymaj!</div>';
  }
  h+='<button class="start-btn" onclick="backToDrill()" style="margin-top:12px;background:#21262d">← Wróć do ćwiczeń</button></div>';
  return h;
}

function renderDrill(mc){
  var c=state.cur;
  var ex=c.t.ex.split("|");
  var vTr=VD[c.v]?VD[c.v].tr:"";
  var h='<div class="drill"><div style="text-align:center;margin-bottom:24px">';
  h+='<span class="badge" style="background:'+mc.ac+'22;border:1px solid '+mc.ac+'66;color:'+mc.ac+'">'+c.t.mood+'</span>';
  h+='<div class="tense-name" style="color:'+mc.lt+'">'+c.t.name+'</div>';
  h+='<div class="tense-hint">'+ex[0]+'</div>';
  h+='<div class="tense-hint-pl">'+ex[1]+'</div></div>';
  h+='<div class="card" style="background:'+mc.bg+';border:1px solid '+mc.ac+'33">';
  h+='<div class="card-verb">'+c.v+'</div>';
  h+='<div class="card-tr">'+vTr+'</div>';
  h+='<div class="card-person" style="color:'+mc.ac+'">'+c.p.l+'</div></div>';
  var cls="ans"+(state.status==="correct"?" ok":state.status==="wrong"?" bad":"");
  h+='<input class="'+cls+'" id="ans" type="text" value="'+escH(state.input)+'" oninput="onInp(this.value)" onkeydown="onKey(event)" placeholder="tu respuesta..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'+(state.status!=="idle"?' disabled':'')+'/>';
  if(state.status==="correct")h+='<div class="fb-ok">¡Correcto! ✓</div>';
  if(state.status==="wrong"){
    h+='<div class="fb-bad"><div class="fb-bad-label">Incorrecto</div><div class="fb-bad-ans">'+state.correctAns+'</div>';
    h+='<button class="next-btn" onclick="gen()">Siguiente →</button></div>';
  }
  if(state.status==="idle"){
    h+='<button class="check-btn" onclick="checkAns()" style="background:'+(state.input.trim()?mc.ac:'#21262d')+';color:'+(state.input.trim()?'#000':'#484f58')+'"'+(state.input.trim()?'':' disabled')+'>Comprobar</button>';
  }
  h+='<div class="accent-row">';
  ["á","é","í","ó","ú","ñ","ü"].forEach(function(ch){
    h+='<button class="accent-btn" onclick="addChar(\''+ch+'\')">'+ch+'</button>';
  });
  h+='</div><div class="skip"><button onclick="gen()">Pomiń →</button></div></div>';
  return h;
}

function escH(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}

// ============ EVENT HANDLERS ============
function onInp(v){state.input=v;render();}
function onKey(e){if(e.key==="Enter"){if(state.status==="wrong")gen();else if(state.status==="idle")checkAns();}}
function addChar(ch){state.input+=ch;render();setTimeout(function(){var el=document.getElementById("ans");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},10);}
function showErr(){state.view="errors";render();}
function showSet(){state.view="settings";render();}
function backToDrill(){state.view="drill";render();}
function startDrill(){state.view="drill";save();gen();}
function clearErrs(){if(confirm("Na pewno wyczyścić wszystkie błędy?")){state.errs=[];save();render();}}
function togT(id){
  var i=state.actT.indexOf(id);
  if(i>=0)state.actT.splice(i,1);else state.actT.push(id);
  save();render();
}
function togMood(mood){
  var ids=TENSES.filter(function(t){return t.mood===mood;}).map(function(t){return t.id;});
  var allOn=ids.every(function(id){return state.actT.indexOf(id)>=0;});
  if(allOn){ids.forEach(function(id){var i=state.actT.indexOf(id);if(i>=0)state.actT.splice(i,1);});}
  else{ids.forEach(function(id){if(state.actT.indexOf(id)<0)state.actT.push(id);});}
  save();render();
}

// ============ INIT ============
load();gen();
</script>
</body>
</html>
