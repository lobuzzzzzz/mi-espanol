<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Conjugación Drill</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;}
.hdr{background:#161b22;border-bottom:1px solid #21262d;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.hdr h1{font-size:20px;font-weight:700;}
.hdr .sub{font-size:12px;color:#8b949e;margin-top:2px;}
.hdr-btns{display:flex;gap:10px;align-items:center;}
.hdr-btns button{background:none;border:1px solid #30363d;color:#8b949e;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
.streak{font-size:13px;color:#f0883e;font-weight:600;}
.panel{padding:16px 20px;background:#161b22;border-bottom:1px solid #21262d;}
.panel-title{font-size:14px;font-weight:600;margin-bottom:12px;color:#c9d1d9;}
.mood-group{margin-bottom:14px;}
.mood-btn{border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;display:inline-block;}
.tense-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.tense-item{display:flex;flex-direction:column;gap:2px;}
.tense-btn{border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;}
.tense-ex{font-size:10px;color:#6e7681;padding-left:2px;max-width:160px;}
.start-btn{margin-top:8px;background:#238636;border:none;color:#fff;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}
.err-panel{max-height:300px;overflow-y:auto;}
.err-item{background:#1c1215;border:1px solid #3d1f28;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
.err-meta{color:#8b949e;margin-bottom:4px;}
.err-wrong{color:#f85149;text-decoration:line-through;}
.err-right{color:#3fb950;font-weight:600;}
.drill{padding:28px 20px;max-width:500px;margin:0 auto;}
.badge{display:inline-block;border-radius:20px;padding:5px 16px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.tense-name{font-size:18px;font-weight:600;margin-top:8px;}
.tense-hint{font-size:13px;color:#8b949e;margin-top:6px;font-style:italic;}
.tense-hint-pl{font-size:12px;color:#6e7681;margin-top:2px;}

.card-verb{font-size:36px;font-weight:800;letter-spacing:-0.03em;color:#fff;margin-bottom:4px;}
.card-tr{font-size:14px;color:#8b949e;margin-bottom:10px;font-style:italic;}
.card-person{font-size:20px;font-weight:500;}
#ans{width:100%;padding:14px 16px;font-size:20px;font-weight:500;border-radius:12px;color:#e6edf3;outline:none;margin-bottom:12px;border:2px solid #30363d;background:#161b22;}
#ans.ok{background:#0d2818;border-color:#3fb950;}
#ans.bad{background:#1c1215;border-color:#f85149;}
.fb-ok{text-align:center;color:#3fb950;font-size:18px;font-weight:700;margin-bottom:16px;}
.fb-bad{text-align:center;margin-bottom:16px;}
.fb-bad-label{color:#f85149;font-size:15px;margin-bottom:6px;}
.fb-bad-ans{font-size:22px;font-weight:700;color:#3fb950;}
.next-btn{margin-top:14px;background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:10px;padding:10px 28px;font-size:15px;font-weight:600;cursor:pointer;}
.check-btn{width:100%;padding:14px;font-size:16px;font-weight:700;border:none;border-radius:12px;cursor:pointer;}
.accent-row{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap;}
.accent-btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.hidden{display:none;}

</head>
<body>

<div id="app">

  <div class="hdr">

  <div class="stats-bar hidden" id="stats-bar"></div>

  <!-- SETTINGS VIEW -->
  <div class="panel hidden" id="view-settings"></div>

  <div class="panel err-panel hidden" id="view-errors"></div>

    <div id="dr-feedback"></div>
    <div id="dr-action"></div>
    <div class="accent-row" id="accent-row"></div>
    <div class="skip"><button onclick="gen()">Pomiń →</button></div>
  </div>
</div>

var RE={pres:{ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]},pret:{ar:["é","aste","ó","amos","asteis","aron"],er:["í","iste","ió","imos","isteis","ieron"],ir:["í","iste","ió","imos","isteis","ieron"]},impf:{ar:["aba","abas","aba","ábamos","abais","aban"],er:["ía","ías","ía","íamos","íais","ían"],ir:["ía","ías","ía","íamos","íais","ían"]},presSub:{ar:["e","es","e","emos","éis","en"],er:["a","as","a","amos","áis","an"],ir:["a","as","a","amos","áis","an"]}};
var FE=["é","ás","á","emos","éis","án"],COE=["ía","ías","ía","íamos","íais","ían"];

function gT(v){var d=VD[v];return d?d.t:v.endsWith("ar")?"ar":v.endsWith("er")?"er":"ir";}

  if(tid==="futuro_compuesto")return HABER.fut[pi]+" "+gP(v);
  if(tid==="condicional_compuesto")return HABER.cond[pi]+" "+gP(v);

    var p3f=d.pret?d.pret.split(",")[5]:st+RE.pret[tp][5];

  }

    if(pi===0){if(d.impTu)return d.impTu;var pf=d.pres?d.pres.split(","):null;return pf?pf[2]:st+RE.pres[tp][2];}
    if(pi===1)return sf[2];if(pi===2)return sf[3];
    if(pi===3){if(d.impVos)return d.impVos;return v.slice(0,-1)+"d";}
    if(pi===4)return sf[5];
  }
  if(tid==="imperativo_neg"){
    var sn=d.presSub?d.presSub.split(","):null;
    if(!sn){sn=[];for(var sn2=0;sn2<6;sn2++)sn.push(st+RE.presSub[tp][sn2]);}
    return"no "+sn[[1,2,3,4,5][pi]];
  }
  return"?";
}

// ============ TENSES & PERSONS ============
var TENSES=[
{id:"presente_ind",name:"Presente",mood:"Indicativo",ex:"Hablo español|Mówię po hiszpańsku"},
{id:"preterito_indefinido",name:"Pretérito Indefinido",mood:"Indicativo",ex:"Ayer comí pizza|Wczoraj zjadłem pizzę"},
{id:"preterito_imperfecto",name:"Pretérito Imperfecto",mood:"Indicativo",ex:"De niño jugaba mucho|Jako dziecko dużo grałem"},
{id:"preterito_perfecto",name:"Pretérito Perfecto",mood:"Indicativo",ex:"Hoy he dormido bien|Dziś dobrze spałem"},
{id:"preterito_pluscuamperfecto",name:"Pretérito Pluscuamperfecto",mood:"Indicativo",ex:"Ya había salido|Już wyszedłem (wcześniej)"},
{id:"futuro_simple",name:"Futuro Simple",mood:"Indicativo",ex:"Mañana iré al gym|Jutro pójdę na siłownię"},
{id:"condicional_simple",name:"Condicional Simple",mood:"Indicativo",ex:"Yo comería más|Ja bym jadł więcej"},
{id:"futuro_compuesto",name:"Futuro Compuesto",mood:"Indicativo",ex:"Habrá llegado ya|Pewnie już dotarł"},
{id:"condicional_compuesto",name:"Condicional Compuesto",mood:"Indicativo",ex:"Habría ido contigo|Byłbym poszedł z tobą"},
{id:"presente_sub",name:"Presente",mood:"Subjuntivo",ex:"Quiero que vengas|Chcę żebyś przyszedł"},
{id:"imperfecto_sub",name:"Imperfecto",mood:"Subjuntivo",ex:"Si tuviera dinero...|Gdybym miał pieniądze..."},
{id:"perfecto_sub",name:"Perfecto",mood:"Subjuntivo",ex:"Espero que hayas comido|Mam nadzieję, że zjadłeś"},
{id:"pluscuamperfecto_sub",name:"Pluscuamperfecto",mood:"Subjuntivo",ex:"Si hubiera sabido...|Gdybym był wiedział..."},
{id:"futuro_sub",name:"Futuro",mood:"Subjuntivo",ex:"Donde fuere...|Gdziekolwiek pójdzie... (archaiczny)"},
{id:"imperativo_af",name:"Imperativo Afirmativo",mood:"Imperativo",ex:"¡Habla! ¡Come!|Mów! Jedz!"},
{id:"imperativo_neg",name:"Imperativo Negativo",mood:"Imperativo",ex:"¡No hables!|Nie mów!"},
];
var PERSONS=[{l:"yo"},{l:"tú"},{l:"él/ella/usted"},{l:"nosotros"},{l:"vosotros"},{l:"ellos/ustedes"}];
var IMP_P=[{l:"tú"},{l:"usted"},{l:"nosotros"},{l:"vosotros"},{l:"ustedes"}];
var VERBS=Object.keys(VD);
var MCOL={Indicativo:{bg:"#1a3a4a",ac:"#4fc3f7",lt:"#e1f5fe"},Subjuntivo:{bg:"#3a1a4a",ac:"#ce93d8",lt:"#f3e5f5"},Imperativo:{bg:"#4a3a1a",ac:"#ffb74d",lt:"#fff3e0"}};

// ============ STATE ============
var actT=TENSES.map(function(t){return t.id;});
var cur=null,status="idle",correctAns="",score={c:0,w:0},errs=[],streak=0;

function load(){try{var s=localStorage.getItem("conj2");if(s){var p=JSON.parse(s);errs=p.e||[];score=p.s||{c:0,w:0};actT=p.t||actT;}}catch(e){}}
function save(){try{localStorage.setItem("conj2",JSON.stringify({e:errs,s:score,t:actT}));}catch(e){}}

function pick(a){return a[Math.floor(Math.random()*a.length)];}

// ============ DOM REFS ============
var $=function(id){return document.getElementById(id);};

// ============ ACCENT BUTTONS (one-time setup) ============
function setupAccents(){
  var row=$("accent-row");row.innerHTML="";
  ["á","é","í","ó","ú","ñ","ü"].forEach(function(ch){
    var b=document.createElement("button");
    b.className="accent-btn";b.textContent=ch;
    b.addEventListener("click",function(e){
      e.preventDefault();
      var inp=$("ans");
      var pos=inp.selectionStart||inp.value.length;
      inp.value=inp.value.slice(0,pos)+ch+inp.value.slice(pos);
      inp.focus();
      inp.setSelectionRange(pos+1,pos+1);
    });
    row.appendChild(b);
  });
}

// ============ INPUT HANDLER (no re-render!) ============
function setupInput(){
  var inp=$("ans");
  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      if(status==="wrong")gen();
      else if(status==="idle")checkAns();
    }
  });
}

// ============ VIEWS ============
function showView(v){
  $("view-drill").classList.add("hidden");
  $("view-settings").classList.add("hidden");
  $("view-errors").classList.add("hidden");
  if(v==="settings"){renderSettings();$("view-settings").classList.remove("hidden");}
  else if(v==="errors"){renderErrors();$("view-errors").classList.remove("hidden");}
  else{$("view-drill").classList.remove("hidden");}
}

function updateHeader(){
  var total=score.c+score.w;
  var pct=total>0?Math.round(score.c/total*100):0;
  $("hdr-score").textContent=total>0?pct+"% · "+score.c+"✓ "+score.w+"✗":"¡Vamos!";
  $("btn-err").textContent="Błędy ("+errs.length+")";
  var se=$("streak-el");
  if(streak>=3){se.textContent="🔥 "+streak;se.classList.remove("hidden");}
  else se.classList.add("hidden");
  var sb=$("stats-bar");
  if(total>0){
    var mm=getMostMissed();
    sb.innerHTML="Sesja: <span>"+total+"</span> · Seria: <span>"+streak+"</span>"+(mm?" · Najczęstszy: <span>"+mm+"</span>":"");
    sb.classList.remove("hidden");
  }else sb.classList.add("hidden");
}

function getMostMissed(){
  if(!errs.length)return null;
  var c={};errs.forEach(function(e){c[e.v]=(c[e.v]||0)+1;});
  var mx=0,w="";for(var k in c)if(c[k]>mx){mx=c[k];w=k;}
  return mx>1?w+" ("+mx+"x)":null;
}

// ============ GENERATE ============
function gen(){
  if(!actT.length)return;
  var t=pick(TENSES.filter(function(x){return actT.indexOf(x.id)>=0;}));
  var isImp=t.mood==="Imperativo";
  cur={v:pick(VERBS),p:pick(isImp?IMP_P:PERSONS),t:t,isImp:isImp};
  status="idle";correctAns="";
  showView("drill");
  renderDrill();
  var inp=$("ans");inp.value="";inp.disabled=false;inp.className="";
  setTimeout(function(){inp.focus();},50);
}

// ============ CHECK ============
function checkAns(){
  var inp=$("ans");
  var val=inp.value.trim();
  if(!val||status!=="idle")return;
  var pi=cur.isImp?IMP_P.indexOf(cur.p):PERSONS.indexOf(cur.p);
  var correct=conj(cur.v,cur.t.id,pi);
  var norm=val.toLowerCase(),normC=correct.toLowerCase();
  var ok=norm===normC;
  if(!ok&&cur.t.id==="imperfecto_sub"){
    var se=correct.replace(/ra$/,"se").replace(/ras$/,"ses").replace(/ramos$/,"semos").replace(/rais$/,"seis").replace(/ran$/,"sen");
    if(norm===se.toLowerCase())ok=true;
  }
  if(ok){
    status="correct";score.c++;streak++;
    inp.className="ok";inp.disabled=true;
    $("dr-feedback").innerHTML='<div class="fb-ok">¡Correcto! ✓</div>';
    $("dr-action").innerHTML="";
    save();updateHeader();
    setTimeout(gen,900);
  }else{
    status="wrong";correctAns=correct;score.w++;streak=0;
    inp.className="bad";inp.disabled=true;
    errs.unshift({v:cur.v,pe:cur.p.l,te:cur.t.name+" ("+cur.t.mood+")",y:val,c:correct});
    if(errs.length>100)errs=errs.slice(0,100);
    $("dr-feedback").innerHTML='<div class="fb-bad"><div class="fb-bad-label">Incorrecto</div><div class="fb-bad-ans">'+correct+'</div></div>';
    $("dr-action").innerHTML='<button class="next-btn" onclick="gen()">Siguiente →</button>';
    save();updateHeader();
  }
}

// ============ RENDER DRILL (no input re-creation) ============
function renderDrill(){
  if(!cur)return;
  var mc=MCOL[cur.t.mood];
  var ex=cur.t.ex.split("|");
  var vTr=VD[cur.v]?VD[cur.v].tr:"";
  $("dr-mood").style.cssText="background:"+mc.ac+"22;border:1px solid "+mc.ac+"66;color:"+mc.ac;
  $("dr-mood").textContent=cur.t.mood;
  $("dr-tname").style.color=mc.lt;
  $("dr-tname").textContent=cur.t.name;
  $("dr-hex").textContent=ex[0];
  $("dr-hpl").textContent=ex[1];
  $("dr-card").style.cssText="background:"+mc.bg+";border:1px solid "+mc.ac+"33;border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:24px;";
  $("dr-verb").textContent=cur.v;
  $("dr-tr").textContent=vTr;
  $("dr-pers").style.color=mc.ac;
  $("dr-pers").textContent=cur.p.l;
  $("dr-feedback").innerHTML="";
  $("dr-action").innerHTML='<button class="check-btn" onclick="checkAns()" style="background:'+mc.ac+';color:#000">Comprobar</button>';
  updateHeader();
}

// ============ RENDER SETTINGS ============
function renderSettings(){
  var h='<div class="panel-title">Wybierz czasy do ćwiczeń:</div>';
  ["Indicativo","Subjuntivo","Imperativo"].forEach(function(mood){
    var mTs=TENSES.filter(function(t){return t.mood===mood;});
    var col=MCOL[mood];
    var allOn=mTs.every(function(t){return actT.indexOf(t.id)>=0;});
    h+='<div class="mood-group">';
    h+='<button class="mood-btn" onclick="togMood(\''+mood+'\')" style="background:'+(allOn?col.ac+'22':'transparent')+';border:1px solid '+col.ac+'55;color:'+col.ac+'">'+mood+(allOn?' ✓':'')+'</button>';
    h+='<div class="tense-list">';
    mTs.forEach(function(t){
      var on=actT.indexOf(t.id)>=0;
      h+='<div class="tense-item"><button class="tense-btn" onclick="togT(\''+t.id+'\')" style="background:'+(on?col.ac+'33':'#21262d')+';border:1px solid '+(on?col.ac:'#30363d')+';color:'+(on?col.lt:'#484f58')+'">'+t.name+'</button>';
      h+='<div class="tense-ex">'+t.ex.split("|")[0]+'</div></div>';
    });
    h+='</div></div>';
  });
  h+='<button class="start-btn" onclick="gen()">Empezar ▸</button>';
  $("view-settings").innerHTML=h;
}

// ============ RENDER ERRORS ============
function renderErrors(){
  var h='';
  if(errs.length>0){
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="panel-title" style="margin:0;color:#f85149">Twoje błędy (zapisane):</div>';
    h+='<button class="clear-btn" onclick="clearErrs()">Wyczyść</button></div>';
    errs.forEach(function(e){
      h+='<div class="err-item"><div class="err-meta">'+e.v+' · '+e.pe+' · '+e.te+'</div>';
      h+='<div><span class="err-wrong">'+e.y+'</span> → <span class="err-right">'+e.c+'</span></div></div>';
    });
  }else{
    h+='<div style="text-align:center;color:#8b949e;padding:20px">Brak błędów — tak trzymaj!</div>';
  }
  h+='<button class="start-btn" onclick="gen()" style="margin-top:12px;background:#21262d">← Wróć</button>';
  $("view-errors").innerHTML=h;
}

function clearErrs(){if(confirm("Wyczyścić?")){errs=[];save();renderErrors();updateHeader();}}
function togT(id){var i=actT.indexOf(id);if(i>=0)actT.splice(i,1);else actT.push(id);save();renderSettings();}
function togMood(mood){
  var ids=TENSES.filter(function(t){return t.mood===mood;}).map(function(t){return t.id;});
  var allOn=ids.every(function(id){return actT.indexOf(id)>=0;});
  if(allOn)ids.forEach(function(id){var i=actT.indexOf(id);if(i>=0)actT.splice(i,1);});
  else ids.forEach(function(id){if(actT.indexOf(id)<0)actT.push(id);});
  save();renderSettings();
}

// ============ INIT ============
load();setupAccents();setupInput();gen();
</script>
</body>
</html>
